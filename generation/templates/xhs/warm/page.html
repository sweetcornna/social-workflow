<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>xhs-page</title>
<style>
  /* warm 手账风 · 内页 1242×1656（3:4） */
  __FONT_FACE__
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; }

  body {
    font-family: __FONT_STACK__;
    background: __BG__;
    color: __FG__;
    position: relative;
    padding: 76px;
  }

  .paper {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: repeating-linear-gradient(180deg, transparent 0 71px, __LINE__ 71px 72px);
  }

  .sheet {
    position: relative; height: 100%;
    background: __SURFACE__;
    border: 5px dashed __LINE__;
    border-radius: 34px;
    padding: 92px 78px 84px;
    display: flex; flex-direction: column;
  }

  .index {
    position: absolute; top: -30px; left: 68px;
    width: 116px; height: 116px; border-radius: 50%;
    background: __ACCENT__; color: __SURFACE__;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums;
  }

  .headline {
    margin-top: 42px;
    font-size: __HEADLINE_SIZE__px; line-height: 1.34; font-weight: 700;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* 荧光笔效果：只涂到文字下半部分 */
  .headline span.hl {
    background: linear-gradient(180deg, transparent 58%, __HIGHLIGHT__ 58%);
  }

  .bullets { flex: 1; list-style: none; padding-top: 56px; }
  .bullet {
    display: flex; gap: 26px; align-items: flex-start;
    font-size: __BULLET_SIZE__px; line-height: 1.62; margin-bottom: 38px;
  }
  .bullet .marker {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px;
    border: 4px solid __ACCENT__; background: __HIGHLIGHT__;
    transform: translateY(8px);
  }
  .bullet span { flex: 1; }

  .footnote {
    border-top: 4px dashed __LINE__; padding-top: 28px;
    font-size: 32px; line-height: 1.6; color: __MUTED__;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .foot {
    margin-top: 32px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 30px; color: __MUTED__;
  }
  .foot .page {
    font-variant-numeric: tabular-nums;
    border: 3px solid __LINE__; border-radius: 999px; padding: 6px 24px;
  }
</style>
</head>
<body>
  <div class="paper"></div>
  <div class="sheet">
    <div class="index">__INDEX__</div>
    <div class="headline"><span class="hl">__HEADLINE__</span></div>
    <ul class="bullets">__BULLETS__</ul>
    <div class="footnote">__FOOTNOTE__</div>
    <div class="foot">
      <span class="mark">__WATERMARK__</span>
      <span class="page">__PAGE_NO__</span>
    </div>
  </div>
</body>
</html>
